{% extends 'base.html' %}

{% block title %}Add Contact{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4">Add New Contact</h1>
    <form method="POST" action="{{ url_for('add_contact') }}">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ temporary.name if temporary else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ temporary.phone_number if temporary else '' }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ temporary.email if temporary else '' }}">
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ temporary.address if temporary else '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Add Contact</button>
        <a href="{{ url_for('view_contacts') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
