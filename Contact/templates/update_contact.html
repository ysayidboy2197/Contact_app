{% extends 'base.html' %}

{% block title %}Update {{ contact.name }}{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4">Update Contact</h1>
    <form method="POST" action="{{ url_for('update_contact', id=contact.id) }}">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" value="{{ contact.name }}" required>
        </div>
        <div class="mb-3">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input type="text" class="form-control" id="phone_number" name="phone_number" value="{{ contact.phone_number }}" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value="{{ contact.email or '' }}">
        </div>
        <div class="mb-3">
            <label for="address" class="form-label">Address</label>
            <input type="text" class="form-control" id="address" name="address" value="{{ contact.address or '' }}">
        </div>
        <button type="submit" class="btn btn-primary">Update Contact</button>
        <a href="{{ url_for('view_contact', id=contact.id) }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
