{% extends 'base.html' %}

{% block title %}{{ contact.name }}{% endblock %}

{% block content %}
<div class="container">
    <h1 class="my-4">{{ contact.name }}</h1>
    <div class="card">
        <div class="card-body">
            <p><strong>Phone:</strong> {{ contact.phone_number }}</p>
            <p><strong>Email:</strong> {{ contact.email or 'N/A' }}</p>
            <p><strong>Address:</strong> {{ contact.address or 'N/A' }}</p>
            <a href="{{ url_for('view_contacts') }}" class="btn btn-secondary">Back to Contacts</a>
            <a href="{{ url_for('update_contact', id=contact.id) }}" class="btn btn-warning">Edit</a>
            <a href="{{ url_for('delete_contact', id=contact.id) }}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete {{ contact.name }}?');">Delete</a>
        </div>
    </div>
</div>
{% endblock %}
